publisher:
  id: copernicus
  name: Copernicus
  abbreviation: Copernicus
  type: international
  url: https://www.copernicus.eu/en
  description: >-
    The European Union's Earth observation programme, which publishes satellite and
    modelled environmental data — land cover, atmosphere, marine and climate reanalysis —
    that covers Malaysia and the surrounding region.
  aliases:
    - Copernicus
    - Copernicus Programme
    - EU Copernicus
    - Copernicus Data Space
  languages: [en]

