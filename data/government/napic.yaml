publisher:
  id: napic
  name: National Property Information Centre
  abbreviation: NAPIC
  type: government
  url: https://napic.jpph.gov.my/
  description: >-
    The property data centre of the Valuation and Property Services Department (JPPH),
    Ministry of Finance. Publishes Malaysian property market data, transaction records and
    price indices.
  aliases:
    - NAPIC
    - Pusat Maklumat Harta Tanah Negara
    - JPPH
    - Jabatan Penilaian dan Perkhidmatan Harta
  country: MY
  languages: [ms, en]
  notes: >-
    NAPIC sits within JPPH, a federal department under the Ministry of Finance, so it is
    recorded as a government publisher rather than a statutory body.

resources:
  - id: napic-property-data
    name: Malaysian property market data
    aliases:
      - property market report
      - laporan pasaran harta tanah
      - house prices
      - Malaysian House Price Index
      - transaction data
      - harta tanah
    publisher: napic
    description: >-
      Malaysian property market information: time series of property market indicators, the
      Malaysian House Price Index, property transaction records and interactive
      visualisations of the market by state and property type.
    categories: [housing-property, economy]
    tags: [property, housing, prices, index, transactions, napic, jpph, real-estate]
    access:
      type: public
      details: >-
