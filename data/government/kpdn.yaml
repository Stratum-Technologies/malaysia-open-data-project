    publisher: kpdn
    description: >-
      The ministry's national price monitoring service. Records prices of a basket of
      everyday goods and fresh produce at retail outlets across Malaysia, published so the
      public can compare prices between premises and locations. Data is browsable on the
      PriceCatcher portal and app.
    categories: [prices-cost-of-living]
    tags: [prices, groceries, cost-of-living, pricecatcher, kpdn, consumer, harga]
    access:
      type: public
      details: >-
        Prices are freely viewable through the portal, the mobile apps and an Open API. The
        portal's terms page applies to the service; reuse terms for the underlying data are
        not stated in a licence, so access is recorded as public rather than open.
