    publisher: copernicus
    description: >-
      Satellite and modelled environmental data covering Malaysia — Sentinel imagery,
      global land cover, and ERA5 climate reanalysis — published through the Copernicus
      Data Space Ecosystem, the Climate Data Store and the land-monitoring service.
    categories: [environment, weather-climate, geography]
    tags: [earth-observation, satellite, sentinel, land-cover, climate, reanalysis]
    access:
      type: register
      details: >-
        Browse and download require a free Copernicus account; some services need a
        registered client for programmatic access.
    license:
      name: Varies by dataset
      verified: false
